async function avaliarLoja(id){const status=document.getElementById('rating-status');if(ratingDraft===null){if(status)status.textContent='Selecione uma nota antes de salvar.';return}const nota=ratingDraft;if(status)status.textContent='Enviando avaliação…';try{const hash=await visitanteHash();const {data,error}=await sb.rpc('avaliar_loja',{p_loja_id:Number(id),p_nota:Number(nota),p_visitante_hash:hash});if(error)throw error;if(data!==true){if(status)status.textContent='Este navegador já avaliou esta loja.';return}const {data:rows,error:statsError}=await sb.rpc('avaliacoes_publicas_lojas');if(statsError)throw statsError;ratingStats={};(rows||[]).forEach(x=>ratingStats[x.loja_id]={media:Number(x.media||0),total:Number(x.total||0)});detail(id);const msg=document.getElementById('rating-status');if(msg)msg.textContent='Obrigado! Sua avaliação foi registrada.';}catch(e){console.error(e);if(status)status.textContent='Falha ao registrar avaliação: '+(e.message||'verifique se o SQL atualizado foi executado no Supabase.');}}
function horarioMarkup(raw){const value=String(raw||'').trim();if(!value)return '';const texto=value.split(/\r?\n|\s*\|\s*|\s*;\s*/).map(x=>x.trim()).filter(Boolean).join(' · ');return `<section class="hours-panel" aria-label="Horário de funcionamento"><div class="hours-heading"><strong>Horário de funcionamento</strong></div><p class="hours-text">${esc(texto)}</p></section>`;}
function detail(id){let l=lojas.find(x=>String(x.id)===String(id));if(!l){home();return}let phone=digits(l.wpp);let mapsUrl=l.end?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(l.end):'';let instagram=String(l.insta||'').trim();let instagramUrl=instagram?( /^https?:\/\//i.test(instagram)?instagram:'https://www.instagram.com/'+instagram.replace(/^@/,'').replace(/^\/+|\/+$/g,'')+'/' ):'';ratingDraft=null;app.innerHTML=`<div class="pg"><div class="w"><div class="ban" style="${l.banner?`background-image:url('${esc(l.banner)}')`:''}"><button class="back" onclick="go('')">← Voltar</button></div><div class="cols"><main><div class="box"><h2>${esc(l.nome)}</h2><p>${esc(l.desc)}</p><div class="public-stats"><div class="public-stat"><b id="loja-acessos">—</b>Acessos ao site</div><div class="public-stat"><b id="loja-conversas">—</b>Conversas via WhatsApp</div></div></div><div class="box rating-box-compact" id="rating-box"><h3>Avalie esta loja</h3><div class="rating-current"><strong>${(ratingStats[l.id]?.media||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}</strong> <span class="stars-display">${'★'.repeat(Math.round(ratingStats[l.id]?.media||0))}${'☆'.repeat(5-Math.round(ratingStats[l.id]?.media||0))}</span><small>${ratingStats[l.id]?.total||0} avaliação(ões)</small></div><div class="rate-row"><div class="rate-actions"><button type="button" class="rate-zero" data-nota="0" aria-pressed="false" onclick="selecionarNota(0)" aria-label="Selecionar zero">0</button>${[1,2,3,4,5].map(n=>`<button type="button" class="rate-star" data-nota="${n}" aria-pressed="false" aria-label="Selecionar ${n} estrela(s)" onclick="selecionarNota(${n})">★</button>`).join('')}</div><button type="button" class="btn s rating-save" onclick="avaliarLoja(${l.id})">Salvar avaliação</button></div><small id="rating-status" class="rating-status">${ratingLoadError?'Não foi possível carregar as avaliações. Execute o SQL atualizado no Supabase.': 'Escolha sua nota; ela só será registrada ao clicar em Salvar avaliação.'}</small></div><div class="box"><h3>Galeria</h3><div class="gal">${l.galeria.map(u=>`<img src="${esc(u)}" onclick="window.open(this.src,'_blank')">`).join('')||'<p>Esta loja ainda não possui fotos adicionais.</p>'}</div></div></main><aside><div class="box"><h3>Informações de contato</h3>${l.end?`<a class="contact-link" href="${esc(mapsUrl)}" target="_blank" rel="noopener noreferrer"><span class="ci">📍</span><span><b>Endereço</b>${esc(l.end)}<br><span style="color:#15803d">Abrir no Google Maps ↗</span></span></a>`:''}${l.horario?horarioMarkup(l.horario):''}${instagramUrl?`<a class="contact-link" href="${esc(instagramUrl)}" target="_blank" rel="noopener noreferrer"><span class="ci">◎</span><span><b>Instagram oficial</b>${esc(instagram)}<br><span style="color:#15803d">Abrir perfil ↗</span></span></a>`:''}<a class="wa" href="https://wa.me/55${phone}" onclick="return abrirWhatsApp(event,${l.id},'${phone}')">Conversar pelo WhatsApp</a></div></aside></div></div></div>`;registrar(Number(id),'visita').catch(e=>console.error('Falha ao registrar visita:',e)).finally(()=>atualizarEstatisticasPublicas(Number(id)));}
async function atualizarEstatisticasPublicas(id){const {data,error}=await sb.rpc('estatisticas_publicas_lojas',{p_loja_id:id});if(error){console.error('Não foi possível carregar os indicadores públicos:',error);const a=document.getElementById('loja-acessos'),c=document.getElementById('loja-conversas');if(a)a.textContent='Erro';if(c)c.textContent='Erro';return}const item=Array.isArray(data)?data[0]:data;if(!item){const a=document.getElementById('loja-acessos'),c=document.getElementById('loja-conversas');if(a)a.textContent='0';if(c)c.textContent='0';return}const acessos=document.getElementById('loja-acessos');const conversas=document.getElementById('loja-conversas');if(acessos)acessos.textContent=Number(item.acessos||0).toLocaleString('pt-BR');if(conversas)conversas.textContent=Number(item.conversas||0).toLocaleString('pt-BR')}
async function abrirWhatsApp(event,id,phone){event.preventDefault();event.stopPropagation();await registrar(id,'conversa');window.open('https://wa.me/55'+phone,'_blank','noopener');return false}
async function registrar(id,tipo){let key='pvj_visitante';let v=localStorage.getItem(key);if(!v){v=crypto.randomUUID();localStorage.setItem(key,v)}let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''));const {error}=await sb.rpc('registrar_evento_loja',{p_loja_id:id,p_tipo:tipo,p_visitante_hash:hash});if(error)throw error;}
function login(){if(user){go('admin');return}app.innerHTML=`<div class="ad" style="max-width:420px"><button class="btn s" onclick="go('')">← Voltar</button><h2>Entrar como administrador</h2><form class="f" id="lf"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><div class="err" id="er"></div><button class="btn">Entrar</button></form></div>`;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();let er=document.getElementById('er');let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){er.textContent='Não foi possível entrar: '+error.message;return}if(!await isAdmin()){await sb.auth.signOut();er.textContent='Este usuário não está autorizado como administrador.';return}await load();go('admin')};}
async function admin(){if(!await isAdmin()){go('login');return}await load();let stats={};const sr=await sb.rpc('estatisticas_lojas');if(!sr.error)(sr.data||[]).forEach(x=>stats[x.loja_id]={acessos:x.acessos,conversas:x.conversas});app.innerHTML=`<div class="ad"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="flex:1">Painel administrativo</h2><button class="btn s" onclick="go('')">Ver portal</button><button class="btn s" onclick="sair()">Sair da conta</button></div><button class="btn" onclick="go('novo')">+ Nova loja</button><div class="box"><h3>Categorias</h3><div style="display:flex;gap:8px"><input id="nc" placeholder="Nova categoria"><button class="btn" onclick="addCat()">Adicionar</button></div>${cats.map(c=>`<div class="lr"><div class="g">${esc(c.nome)}</div><button class="btn d" onclick="delCat(${c.id})">Excluir</button></div>`).join('')}</div>${lojas.map(l=>`<div class="lr"><img src="${esc(l.logo)}"><div class="g"><b>${esc(l.nome)}</b><small>${esc(l.cat)}</small><div class="stats"><div class="ib"><b>${stats[l.id]?.acessos||0}</b>Acessos à página</div><div class="ib"><b>${stats[l.id]?.conversas||0}</b>Conversas via WhatsApp</div></div></div><button class="btn s" onclick="go('edit-${l.id}')">Editar</button><button class="btn d" onclick="delLoja(${l.id})">Excluir</button></div>`).join('')}</div>`;}
async function sair(){const {error}=await sb.auth.signOut();if(error){alert('Não foi possível sair da conta: '+error.message);return}user=null;go('')}
async function addCat(){let n=document.getElementById('nc').value.trim();if(!n)return;let {error}=await sb.from('categorias').insert({categoria:n});if(error)alert(error.message);else admin()}
async function delCat(id){if(!confirm('Excluir categoria?'))return;let {error}=await sb.from('categorias').delete().eq('id',id);if(error)alert(error.message);else admin()}
async function delLoja(id){if(!confirm('Excluir esta loja?'))return;let {error}=await sb.from('Lojas').delete().eq('id',id);if(error)alert(error.message);else admin()}
function form(id){let l=id?lojas.find(x=>String(x.id)===String(id)):null;draft=l?{...l,galeria:[...l.galeria]}:{ativo:true,galeria:[]};app.innerHTML=`<div class="ad"><button class="btn s" onclick="go('admin')">← Voltar</button><h2>${id?'Editar':'Nova'} loja</h2><form class="f" id="sf"><label>Nome<input name="nome" required value="${esc(draft.nome)}"></label><label>Categoria<select name="categoria" required><option value="">Selecione</option>${cats.map(c=>`<option ${c.nome===draft.cat?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></label><label>Descrição<textarea name="descricao">${esc(draft.desc)}</textarea></label><label>Endereço<input name="endereco" value="${esc(draft.end)}"></label><label>Telefone / WhatsApp<input name="telefone_whatsapp" value="${esc(draft.wpp)}" required></label><label>Horário<input name="horario_atendimento" value="${esc(draft.horario)}"></label><label>Instagram<input name="instagram" value="${esc(draft.insta)}"></label><label>Imagem do card<input type="file" id="logo" accept="image/*"><span class="file-hint">A imagem será comprimida automaticamente antes do envio (máximo final: 120 KB).</span></label><label>Banner<input type="file" id="banner" accept="image/*"><span class="file-hint">Dimensões obrigatórias: 1137 × 380 px. Compressão automática (máximo final: 120 KB).</span></label><label>Fotos da galeria<input type="file" id="galeria" accept="image/*" multiple><span class="file-hint">Todas as fotos serão comprimidas automaticamente (máximo final: 120 KB por foto).</span></label><label><input type="checkbox" name="ativo" ${draft.ativo!==false?'checked':''}> Loja ativa</label><div class="err" id="er" aria-live="polite"></div><button class="btn" id="save-store">Salvar loja</button></form></div>`;
async function validarImagem(file,rotulo,exigirBanner=false){if(!file)return;if(!file.type.startsWith('image/'))throw new Error(`${rotulo}: selecione um arquivo de imagem.`);if(exigirBanner){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Não foi possível ler as dimensões do banner.'));img.src=url});if(img.naturalWidth!==1137||img.naturalHeight!==380)throw new Error(`Banner: a imagem precisa ter exatamente 1137 × 380 px. A imagem selecionada tem ${img.naturalWidth} × ${img.naturalHeight} px.`)}finally{URL.revokeObjectURL(url)}}}
async function comprimirImagem(file,rotulo,manterDimensoes=false){if(!file)return null;let img,url=URL.createObjectURL(file);try{img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error(`${rotulo}: não foi possível abrir a imagem.`));img.src=url});const originalW=img.naturalWidth,originalH=img.naturalHeight;let w=manterDimensoes?originalW:Math.min(originalW,1600),h=manterDimensoes?originalH:Math.round(originalH*(w/originalW));const limite=120*1024;let melhor=null;for(let escala=1;escala>=.4;escala-=.1){if(!manterDimensoes&&escala<1){w=Math.max(1,Math.round(Math.min(originalW,1600)*escala));h=Math.max(1,Math.round(Math.min(originalW,1600)*escala*originalH/originalW))}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Não foi possível preparar a imagem para compressão.');ctx.drawImage(img,0,0,w,h);for(const qualidade of [.82,.72,.62,.52,.42,.32,.24]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',qualidade));if(!blob)throw new Error('O navegador não conseguiu comprimir a imagem.');if(!melhor||blob.size<melhor.size)melhor=blob;if(blob.size<=limite)return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp',lastModified:Date.now()})}if(manterDimensoes)break}if(!melhor||melhor.size>limite)throw new Error(`${rotulo}: não foi possível reduzir a imagem para até 120 KB mantendo ${manterDimensoes?'as dimensões obrigatórias do banner':'uma qualidade adequada'}. Selecione uma imagem menor.`);return new File([melhor],file.name.replace(/\.[^.]+$/,'')+'.webp',{type:'image/webp',lastModified:Date.now()})}finally{URL.revokeObjectURL(url)}}
document.getElementById('sf').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,botao=document.getElementById('save-store'),erro=document.getElementById('er');botao.disabled=true;erro.textContent='Preparando e comprimindo as imagens…';try{let fd=new FormData(f),d=Object.fromEntries(fd.entries());d.ativo=f.ativo.checked;const logoOriginal=document.getElementById('logo').files[0],bannerOriginal=document.getElementById('banner').files[0],galeriaOriginal=[...document.getElementById('galeria').files];await validarImagem(logoOriginal,'Imagem do card');await validarImagem(bannerOriginal,'Banner',true);for(const file of galeriaOriginal)await validarImagem(file,'Foto da galeria');const [logoFile,bannerFile]=await Promise.all([comprimirImagem(logoOriginal,'Imagem do card'),comprimirImagem(bannerOriginal,'Banner',true)]);const galeriaFiles=[];for(let i=0;i<galeriaOriginal.length;i++){erro.textContent=`Comprimindo foto ${i+1} de ${galeriaOriginal.length}…`;galeriaFiles.push(await comprimirImagem(galeriaOriginal[i],`Foto ${i+1} da galeria`))}const folder=(draft.nome||d.nome||'loja').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');async function upload(file,sub){if(!file)return null;const path=`${folder}/${sub}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error}=await sb.storage.from('fotos_lojas').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return fileUrl(path)}erro.textContent='Enviando imagens otimizadas…';const logo=await upload(logoFile,'imagem_card'),banner=await upload(bannerFile,'banner');let gal=[...draft.galeria];for(const file of galeriaFiles){const url=await upload(file,'galeria');if(url)gal.push(url)}d.imagem_card=logo||draft.logo||null;d.Banner=banner||draft.banner||null;d.galeria=JSON.stringify(gal);const result=id?await sb.from('Lojas').update(d).eq('id',id):await sb.from('Lojas').insert(d);if(result.error)throw result.error;await admin()}catch(err){erro.textContent='Erro ao salvar: '+err.message;botao.disabled=false}}}
init();
</script></body></html>
